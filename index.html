<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZEYCORA</title>

  <style>
    body{
      margin:0;
      background:#0a0a0a;
      color:white;
      font-family:Arial, Helvetica, sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      text-align:center;
    }

    .container{
      max-width:700px;
      padding:20px;
    }

    h1{
      font-size:72px;
      letter-spacing:8px;
      margin-bottom:10px;
    }

    .accent{
      color:#9B111E;
    }

    p{
      color:#cfcfcf;
      font-size:20px;
      margin-bottom:40px;
    }

    .button{
      display:inline-block;
      padding:14px 32px;
      border:1px solid #9B111E;
      color:white;
      text-decoration:none;
      border-radius:8px;
      transition:0.3s;
    }

    .button:hover{
      background:#9B111E;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>ZEY<span class="accent">CORA</span></h1>

    <p>
      Software • Automation • Service Platforms
    </p>

    <a class="button" href="mailto:contacto@zeycora.com">
      Contact
    </a>

  </div>

</body>
</html>
